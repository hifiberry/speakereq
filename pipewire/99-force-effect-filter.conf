# WirePlumber Configuration for SpeakerEQ2x2
#
# This configuration forces all audio output streams to route through
# the SpeakerEQ2x2 filter chain automatically.
#
# Installation:
#   1. Make sure the filter-chain is running (see filter-chain.conf)
#   2. Copy this file to ~/.config/wireplumber/wireplumber.conf.d/99-force-effect-filter.conf
#   3. Restart WirePlumber: systemctl --user restart wireplumber
#
# This will automatically redirect all audio playback to the effect_input.speakereq2x2 sink,
# which processes the audio through the SpeakerEQ2x2 plugin before sending it to your speakers.

monitor.alsa.rules = [
  {
    matches = [
      {
        "media.class": "Stream/Output/Audio"
      }
    ]
    actions = {
      update-props = {
        "target.object": "speakereq2x2"
      }
    }
  }
]
