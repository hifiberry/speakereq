# PipeWire Filter Chain Configuration for SpeakerEQ2x2
#
# This configuration creates a PipeWire filter chain that loads the
# speakereq2x2 LADSPA plugin for stereo speaker equalization.
#
# Installation:
#   1. Build and install the plugin: sudo make install
#   2. Copy this file to: /etc/pipewire/pipewire.conf.d/90-speakereq.conf
#   3. Restart PipeWire and WirePlumber: systemctl --user restart pipewire wireplumber
#
# Runtime Parameter Control:
#   Parameters are configured in the control section below. All LADSPA parameters
#   can be set in this file. Restart PipeWire after making changes.
#
# Note: All parameters below are commented out. They will use plugin defaults.
# Uncomment and modify the parameters you want to change.
#
# The filter chain will automatically connect to your audio playback streams.

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker EQ 2x2"
            media.name       = "Speaker EQ 2x2"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = speakereq2x2
                        plugin = /usr/lib/ladspa/speakereq2x2.so
                        label  = speakereq2x2
                        control = {
                            # All parameters are commented out to use plugin defaults.
                            # Uncomment and modify the parameters you want to change below.
                            # Restart PipeWire after making changes to this file.
                            
                            # Enable the plugin (0=disabled, 1=enabled) - default: 1
                            # "Enable" = 1
                            
                            # Input EQ: 20 bands per channel (default: all NOOP/disabled)
                            # Format: input_<channel>_eq_<band>_<param>
                            # Channels: 0=left, 1=right | Bands: 1-20
                            # Params: type, f (frequency), q (Q factor), gain (dB)
                            # Types: 0=NOOP, 1=HP (highpass), 2=LP (lowpass), 3=PEQ (peaking),
                            #        4=NOTCH, 5=LS (low shelf), 6=HS (high shelf),
                            #        7=HP1 (1st order highpass), 8=LP1 (1st order lowpass)

                            # Example: Enable a lowpass filter at 15kHz on input channel 0, band 1
                            # "input_0_eq_1_type" = 2
                            # "input_0_eq_1_f"    = 15000.0
                            # "input_0_eq_1_q"    = 0.707
                            # "input_0_eq_1_gain" = 0.0
                            # "input_0_eq_1_enabled" = 1
                            
                            # Crossbar mixer: Identity matrix (default: L->L, R->R)
                            # "xbar_0_to_0" = 1.0   # Left input to left output
                            # "xbar_0_to_1" = 0.0   # Left input to right output
                            # "xbar_1_to_0" = 0.0   # Right input to left output
                            # "xbar_1_to_1" = 1.0   # Right input to right output
                            
                            # Output EQ: 20 bands per channel (default: all NOOP/disabled)
                            # Format: output_<channel>_eq_<band>_<param>
                            
                            # Example: Add a high-shelf boost on output channel 0, band 1
                            # "output_0_eq_1_type" = 6    # 6 = HS (high shelf)
                            # "output_0_eq_1_f"    = 10000.0
                            # "output_0_eq_1_q"    = 0.707
                            # "output_0_eq_1_gain" = 3.0
                            # "output_0_eq_1_enabled" = 1
                            
                            # Delay compensation (default: 0.0 ms, range: 0-100ms)
                            # "delay_0_ms" = 0.0   # Left channel delay
                            # "delay_1_ms" = 0.0   # Right channel delay
                            
                            # Gain controls (default: 0.0 dB, range: -100 to +24 dB)
                            # "input_gain_0_db"  = 0.0   # Left input gain
                            # "input_gain_1_db"  = 0.0   # Right input gain
                            # "output_gain_0_db" = 0.0   # Left output gain
                            # "output_gain_1_db" = 0.0   # Right output gain
                            # "master_gain_db"   = 0.0   # Master gain (both channels)
                        }
                    }
                ]
            }
            capture.props = {
                node.name        = "speakereq2x2"
                media.class      = Audio/Sink
                node.virtual     = true
                node.always-process = true
                filter.smart     = true
                priority.session = 2000
                priority.driver  = 1
                audio.channels   = 2
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.name      = "speakereq2x2.output"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
